\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$d\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"e:I[11997,[\"/_next/static/chunks/58689c96b0676c41.js\",\"/_next/static/chunks/a22b040cde76a1a9.js\",\"/_next/static/chunks/3c86dd9086b2f598.js\"],\"default\"]\nf:T2677,"])</script><script>self.__next_f.push([1,"\nWorking across more than one AWS IAM user is normal: sandbox vs client, personal vs company, read-only vs deploy. The AWS CLI does that with **named profiles**. Most “wrong account” failures are not mysterious AWS behavior - they are a wrong profile, leftover environment keys, or Console and CLI pointing at different places.\n\nThe model is simple once you see it:\n\n**one IAM user -\u003e one access key pair -\u003e one named profile -\u003e select with `AWS_PROFILE` or `--profile` -\u003e prove it with `sts get-caller-identity`.**\n\nRegion is a separate dial. Confirm that too.\n\n## Why profiles exist\n\nEvery CLI call needs three things:\n\n1. **Who you are** - IAM user or role \n2. **Which account** - the 12-digit account ID \n3. **Which region** - e.g. `ap-southeast-1`\n\nIAM users live inside accounts. Each can have access keys. Those keys should not be shared, and you should not overwrite a single global credential every time you change jobs.\n\nA **profile** is a named bundle of credentials plus optional defaults (region, output format). You pick a profile per shell or per command. The CLI signs requests as that identity.\n\n| Profile name | IAM user | Account | Use |\n| :--- | :--- | :--- | :--- |\n| `default` | personal / sandbox | Account A | casual fallback |\n| `cloudsol_devops_engineer` | same name as the user | Account B | client / prod ops |\n| `alice_admin` | `alice` | Account C | another team |\n\nName the profile after the IAM username. Then “who am I?” stays obvious when you stare at `echo $AWS_PROFILE` at 1 a.m.\n\n## Two files under `~/.aws`\n\n### `credentials` - secrets only\n\nSection name equals profile name. No `profile` prefix.\n\n```ini\n[default]\naws_access_key_id = AKIA................\naws_secret_access_key = ........................................\n\n[cloudsol_devops_engineer]\naws_access_key_id = AKIA................\naws_secret_access_key = ........................................\n```\n\n### `config` - non-secrets\n\nRegion, output, SSO, assume-role chains. Named profiles need the `profile` prefix. `default` does not.\n\n```ini\n[default]\nregion = ap-southeast-1\noutput = json\n\n[profile cloudsol_devops_engineer]\nregion = ap-southeast-1\noutput = json\n\n[profile alice_admin]\nregion = us-east-1\noutput = json\n```\n\nKeep credentials private (`chmod 600` is a good habit). Never commit either file. Never paste secrets into tickets or chat.\n\n## Create a profile for a new IAM user\n\n1. In the **correct** account console: IAM \u003e Users \u003e create user \u003e attach least-privilege policies \u003e Security credentials \u003e Create access key \u003e **CLI**. Save the secret once; you will not see it again.\n2. On your laptop:\n\n```bash\naws configure --profile cloudsol_devops_engineer\n```\n\nFill in key, secret, region, output. That writes both files.\n\n3. Confirm:\n\n```bash\naws configure list-profiles\naws configure list --profile cloudsol_devops_engineer\n```\n\n## How to select the user\n\n### Session (best for a stretch of work)\n\n```bash\nexport AWS_PROFILE=cloudsol_devops_engineer\necho \"$AWS_PROFILE\"\n```\n\nEvery `aws` command in that shell uses it until you change or unset it.\n\n```bash\nunset AWS_PROFILE\n```\n\nAfter unset, the CLI falls back to `default` if that profile exists.\n\n### One command\n\n```bash\naws s3 ls --profile cloudsol_devops_engineer\naws ec2 describe-instances --profile alice_admin --region us-east-1\n```\n\n### Two terminals\n\nLeave each shell on a different profile. Profiles are per process. They do not fight.\n\n## The command you should run constantly\n\n```bash\naws sts get-caller-identity\n```\n\n```json\n{\n  \"UserId\": \"AIDAEXAMPLEID\",\n  \"Account\": \"422766738122\",\n  \"Arn\": \"arn:aws:iam::422766738122:user/cloudsol_devops_engineer\"\n}\n```\n\n| Field | Read it as |\n| :--- | :--- |\n| `Arn` | Exact user or role |\n| `Account` | Exact account ID |\n| `UserId` | Internal principal ID |\n\nShort forms:\n\n```bash\naws sts get-caller-identity --query Arn --output text\naws sts get-caller-identity --query Account --output text\naws sts get-caller-identity --profile cloudsol_devops_engineer\n```\n\n**Habit:** before anything that deletes, pushes images, or touches security groups, run `get-caller-identity` and check **both** user and account.\n\n## What wins when several credentials are set\n\nRough priority, highest first:\n\n1. Env vars: `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `AWS_SESSION_TOKEN` if present \n2. Profile: `--profile`, or `AWS_PROFILE` / `AWS_DEFAULT_PROFILE` \n3. The `default` profile in the credentials file \n4. Instance / container / SSO / role chains on servers \n\n### Trap: leftover env keys\n\nIf you once did:\n\n```bash\nexport AWS_ACCESS_KEY_ID=AKIA...\nexport AWS_SECRET_ACCESS_KEY=...\n```\n\nthose **override** `AWS_PROFILE`. You think you switched. You did not.\n\n```bash\nunset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN\nexport AWS_PROFILE=cloudsol_devops_engineer\naws sts get-caller-identity\naws configure list\n```\n\n`aws configure list` shows whether the key and region came from env or from a file. Use it when the story feels wrong.\n\n## Region is independent of identity\n\nWays to set it:\n\n1. Profile block in `~/.aws/config` \n2. `export AWS_REGION=ap-southeast-1` (or `AWS_DEFAULT_REGION`) \n3. `--region ap-southeast-1` on one command \n\n```bash\nexport AWS_PROFILE=cloudsol_devops_engineer\nexport AWS_REGION=ap-southeast-1\naws ec2 describe-instances\n```\n\nConsole and CLI must match on **account and region**. Resources in Singapore will not appear if the Console region picker is still on Virginia.\n\n## Day-to-day loop\n\n**Start:**\n\n```bash\nexport AWS_PROFILE=cloudsol_devops_engineer\nexport AWS_REGION=ap-southeast-1\naws sts get-caller-identity\n```\n\n**Switch:**\n\n```bash\nexport AWS_PROFILE=alice_admin\naws sts get-caller-identity\n```\n\n**One-off without changing the session:**\n\n```bash\naws iam list-users --profile alice_admin\n```\n\n**Hygiene at the end of a session (optional):**\n\n```bash\nunset AWS_PROFILE\nunset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN\n```\n\n## Cross-account reality check\n\nAn IAM user in account `111111111111` does not become account `222222222222` by changing region. Profiles map to **keys of a specific user in a specific account**.\n\nFor two accounts you usually have either:\n\n- two IAM users -\u003e two profiles, or \n- one user that **assumes a role** in the other account (`role_arn` + `source_profile` in config)\n\nFor most laptop multi-client setups, **one profile per IAM user** stays the low-drama path.\n\n## Where this bites: Docker + ECR\n\nECR registries are account-scoped:\n\n```text\n\u003cACCOUNT_ID\u003e.dkr.ecr.\u003cREGION\u003e.amazonaws.com\n```\n\nThe login password must come from a principal **in that same account**:\n\n```bash\nexport AWS_PROFILE=cloudsol_devops_engineer\n\nACCOUNT=$(aws sts get-caller-identity --query Account --output text)\nREGION=ap-southeast-1\n\naws ecr get-login-password --region \"$REGION\" \\\n  | docker login --username AWS --password-stdin \\\n    \"${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com\"\n```\n\nLog in with Profile A (account `9566…`) and push to a registry hostname for account `4227…`, and you get authorization / “no basic auth credentials” errors that look like Docker problems. They are account mismatches.\n\nAlign all three:\n\n1. `AWS_PROFILE` \n2. Account from `sts` \n3. Account ID in the ECR hostname \n\n## Console vs CLI when something “is missing”\n\n| Check | CLI | Console |\n| :--- | :--- | :--- |\n| Identity | `aws sts get-caller-identity` | Top-right account name / ID |\n| Region | profile / `AWS_REGION` / `--region` | Top-right region menu |\n| User | ARN ends with `/user/NAME` | Correct IAM login or federated role |\n\nSame account + same region. A correct profile does not help if the browser is still on another account.\n\n## Security habits worth keeping\n\n1. Prefer **named profiles** for anything important. Keep `default` empty, sandbox-only, or clearly labeled. \n2. **One human, one set of keys.** Do not share access keys. \n3. **Rotate** if a key shows up in chat, screenshots, tickets, or git history. \n4. Never commit `~/.aws/credentials`. \n5. Least privilege on the IAM user; split deploy vs read-only when it helps. \n6. Prefer **SSO / temporary credentials** when the org supports it - same profile idea, shorter-lived secrets.\n\n### Optional: SSO profiles\n\n```bash\naws configure sso --profile company_devops\naws sso login --profile company_devops\nexport AWS_PROFILE=company_devops\naws sts get-caller-identity\n```\n\nYou still switch with `AWS_PROFILE`. Only how credentials are obtained changes.\n\n## Troubleshooting\n\n| Symptom | Likely cause | Fix |\n| :--- | :--- | :--- |\n| Wrong account | Wrong profile or env keys overriding | `aws configure list`; unset env keys; set `AWS_PROFILE`; re-run `sts` |\n| `Unable to locate credentials` | No profile / empty credentials | `aws configure --profile NAME` |\n| Missing in Console | Wrong account or region in the browser | Match account ID + region to CLI |\n| `AccessDenied` | Right user, thin IAM policy | Fix permissions for that user |\n| ECR push auth errors | Login account ≠ registry account | Login with the profile that owns that account ID |\n| Profile “ignored” | `AWS_ACCESS_KEY_ID` still set | Unset access key env vars |\n\n## Cheat sheet\n\n```bash\naws configure --profile MY_USER\naws configure list-profiles\n\nexport AWS_PROFILE=MY_USER\nexport AWS_REGION=ap-southeast-1\naws sts get-caller-identity\n\naws s3 ls --profile OTHER_USER\n\nunset AWS_PROFILE\nunset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN\naws configure list\n```\n\n## Closing\n\nMulti-user CLI work stays boring when you treat identity as a deliberate switch, not ambient luck. Verify before anything that creates, deletes, or pushes. Most mystery failures shrink to: wrong profile, leftover env keys, or Console/CLI account-region mismatch.\n\nSibling note on AWS cost floors and Express Mode: [AWS cost floors: ALB, NAT, Express Mode, and free-tier traps](/ops/aws-cost-floors-alb-nat-express-mode-free-tier).\n"])</script><script>self.__next_f.push([1,"10:T2cfd,"])</script><script>self.__next_f.push([1,"\nThe cheap AWS trap is a false choice: a Kubernetes cluster you do not need, or a single VM you cannot sleep on.\n\nThe useful question is **total cost of ownership**: cloud bill, operational overhead, security boundary, and what breaks when the one box dies.\n\nThis note walks four layers of that question: a small EC2 bill, hardening a public origin, ECS Express Mode vs a pet host, and a serverless demo that stays near zero. Numbers are **On-Demand, Linux, 730-hour months**. The EC2 table uses **Asia Pacific (Singapore)** because that is where a `t3.small` actually lands near **$19**. Fargate unit prices below are **US East (N. Virginia)** from the public pricing page - treat them as a floor; Singapore is higher.\n\n## Why the bill is $77, not $19\n\nFive small containers or Next.js apps behind an **Application Load Balancer** and a **NAT Gateway** often look like this:\n\n| Resource | What you are paying for | Monthly floor |\n| :--- | :--- | :--- |\n| EC2 `t3.small` | 2 vCPU burst, 2 GiB, On-Demand in `ap-southeast-1` (`$0.0264/hr`) | **~$19.27** |\n| NAT Gateway | `$0.045/hr` plus `$0.045/GB` processed (both directions) plus internet egress | **~$32.85** before data |\n| ALB | Hourly charge plus LCUs | **~$16-20** idle |\n| Public IPv4 | `$0.005/hr` **per address**, including ALB and NAT IPs | **~$3.65 each** |\n\nThe **$77** headline undercounts. An internet-facing ALB in two AZs typically has **two** public IPv4s (~$7.30). The NAT Gateway has another (~$3.65). Before transfer, the real floor is closer to **$85-110**.\n\nTwo decisions are independent. Do not bundle them:\n\n1. **Delete the NAT Gateway.** Put the instance in a public subnet, or keep it private and use **VPC endpoints** for S3, ECR, and SSM. That is the $33 line.\n2. **Delete the ALB.** Routing, TLS, health checks, and drain move onto the host.\n\nYou can do (1) without (2). Doing (2) without (1) is usually a worse deal: NAT costs more than the ALB.\n\n## What changes if you strip the ALB\n\nPublic subnet, no NAT, no ALB, one Elastic IP on the instance:\n\n| Resource | Monthly |\n| :--- | :--- |\n| EC2 `t3.small` | ~$19.27 |\n| 30 GB `gp3` | ~$2.40-$2.70 |\n| Public IPv4 | ~$3.65 |\n| ALB / NAT | $0 |\n| **Floor** | **~$25-26** |\n\nArchitecturally:\n\n- **Routing moves to the host.** Nginx (or Caddy) on the instance listens and fans out to the five containers.\n- **One failure domain.** There is no target group to drain. Replacing the only container is how you get a brief **502**, not `nginx -s reload` itself - reload is graceful.\n- **The origin is on the public internet.** Clients can hit the raw IP unless you lock the security group.\n\nThat $52 “saving” is real on the invoice. It is not free in ops: patching, disk, log rotation, and the 2 a.m. kernel panic are now yours. Two hours of that work in a month erases the cloud delta.\n\n## Hardening a public EC2 origin\n\nIf the instance has a public IPv4, anyone who finds `1.2.3.4` can bypass the CDN. Defense in depth still works. It is **not** $0 if you turn on WAF.\n\n```text\nInternet -\u003e CloudFront (+ optional WAF) -\u003e security group (CloudFront prefix list) -\u003e Nginx\n```\n\n### Edge: Shield Standard vs WAF\n\n**AWS Shield Standard** is on by default and absorbs a lot of volumetric **L3/L4** noise at the edge. It does not replace application-layer filtering.\n\n**AWS WAF** is extra: typically **$5 / web ACL + $1 / rule + ~$0.60 / million requests**, unless you are on a CloudFront flat-rate plan that bundles WAF. Put WAF on the distribution if you need path and rate rules. Do not list it as a free control.\n\n### Network: CloudFront origin-facing prefix list\n\nIn the instance security group, allow the origin port **only** from the AWS-managed prefix list `com.amazonaws.global.cloudfront.origin-facing` (IPv6: `com.amazonaws.global.ipv6.cloudfront.origin-facing`). AWS keeps the ranges current.\n\n**Quota trap:** that list has **weight 55**. A security group’s default quota is **60 rules**, so one prefix-list rule leaves **five** slots. Opening **80 and 443** from the list is **110** and needs a quota increase. Prefer **one** origin port, **443**.\n\nThis does not “drop pings.” Security groups deny ICMP unless you allow it. The prefix list only filters the TCP port you attach it to.\n\nSet CloudFront’s origin HTTP/HTTPS port to match. **8080 works** if the distribution origin is configured for it. Default mental model is still 443.\n\n### App: origin custom header\n\nAdd an origin custom header on the distribution (a shared secret). Require it on Nginx. Prefer `map`, not `if` in `server` / `location` - Nginx `if` is a known footgun.\n\n```nginx\nmap $http_x_origin_secret $origin_ok {\n    default 0;\n    \"your-secure-token-here\" 1;\n}\n\nserver {\n    listen 443 ssl;\n\n    location / {\n        if ($origin_ok = 0) {\n            return 403;\n        }\n        # proxy_pass to local containers…\n    }\n}\n```\n\nThis is a handshake, not cryptography. Rotate it, do not log it, do not echo it on error pages. Pair it with the prefix list so the secret is not the only gate.\n\n**Stronger 2025+ pattern:** [CloudFront VPC origins](https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html). The EC2 (or ALB) origin stays private. There is no public IPv4 to discover. Use prefix lists + a header when the origin must remain public.\n\n### Host: rate limits, Fail2ban, SSM\n\n- Rate-limit sensitive paths in Nginx (`limit_req_zone`) **or**, better, at CloudFront / WAF using the **client** IP.\n- **Fail2ban behind CloudFront is easy to get wrong.** The origin sees **CloudFront IPs**, not browsers. A naive jail bans edge nodes and black-holes your own site. If you jail on the host, use Nginx `real_ip` with CloudFront as trusted proxies and never ban those addresses. Prefer WAF rate rules on the first `X-Forwarded-For`.\n- Close inbound **22**. Use **SSM Session Manager**: agent on the instance, IAM instance profile, outbound HTTPS to SSM (or VPC endpoints).\n\n## ECS Express Mode vs a cheap EC2\n\n**Amazon ECS Express Mode** (GA November 2025) is a real product. You give it a container image plus two IAM roles. It provisions **Fargate**, an **internet-facing ALB with HTTPS**, autoscaling, canary deploys, and a `*.ecs.\u003cregion\u003e.on.aws` URL. There is **no Express Mode surcharge**. You pay Fargate + ALB + logs + transfer.\n\nIt can share **one ALB across up to 25** Express services in the same VPC via host-header rules. That is the cost win versus one ALB per service. It does **not** delete the ALB.\n\nDefault task size is **1 vCPU / 2 GB**. Always-on Linux/x86 in us-east-1 is about **$36/mo** compute (`$0.000011244` per vCPU-second + `$0.000001235` per GB-second). Add ALB (~$16-20) and two ALB public IPv4s (~$7). **One default Express service is ~$55-65/mo**, not $27-35.\n\nThe $30-shaped bill only appears with a **tiny** task (0.25 vCPU / 0.5 GB ≈ $9) plus one ALB, and often by ignoring IPv4. That is **one** service, not five containers packed onto a `t3.small`.\n\n| Setup | Honest monthly floor | What you run |\n| :--- | :--- | :--- |\n| 5 containers on one public `t3.small` + Nginx | **~$25** | Shared kernel, one AZ, you patch |\n| 1 Express service, 0.25 vCPU | **~$30-40** including ALB | One web/API |\n| 1 Express service, default 1 vCPU / 2 GB | **~$55-65** | One web/API |\n| 5 Express services, tiny tasks, shared ALB | **~$60-80** | Five isolated tasks |\n| 5 Express services, default size, shared ALB | **~$200+** | Five default tasks |\n\nFargate isolation (Firecracker microVM per task) is the real product difference versus Docker on one EC2 kernel. The deploy API is `CreateExpressGatewayService` / `UpdateExpressGatewayService`, not “just `update-service`.” Express Mode is a **HTTPS web/API** shortcut. It is not every ECS workload.\n\n**Verdict:** strip **NAT** first. Keep the **ALB** unless you accept a single-host origin and put CloudFront (ideally a VPC origin) in front. Use Express Mode when you want managed containers and can pay **ALB + per-task Fargate** as the floor.\n\n## Marketplace scale is a different problem\n\nA $25 box does not become Shopee by adding service names.\n\nFor a **large AWS marketplace**, the usual split is still right: CloudFront + WAF at the edge, containers on ECS or EKS, **OpenSearch** for faceted search, **ElastiCache** for sessions and hot counters, **Aurora** for money, **DynamoDB** for key-value, queues (**SQS / EventBridge / Kinesis**) so checkout is not a synchronous fan-out.\n\nTreat that as a **template**, not a company diagram.\n\n- **Klook** has a public AWS story: Aurora for orders/users, DynamoDB for personalization, ECS/Fargate for containers.\n- **Shopee** flash-sale write-ups are a different stack: Go services, Redis Lua inventory paths, Kafka, TiDB. Do not paste an AWS reference architecture on that name.\n\nFlash sales fail on **hot keys, inventory races, checkout fan-out, and connection pools**. Global Accelerator is optional. It is not the thing that saves you.\n\n## A near-zero portfolio case study\n\nFor a demo that should **idle cheap**, skip always-on compute.\n\n```text\nCloudFront + S3 -\u003e API Gateway HTTP API -\u003e Lambda -\u003e DynamoDB\n                         ↑ Cognito\n                         SQS (async work)\n```\n\n**$0.00 / month is a usage envelope**, not a promise. Put a billing alarm on day one.\n\n| Piece | What is actually free |\n| :--- | :--- |\n| CloudFront | Pay-as-you-go Always Free is generous: **1 TB** data out + **10M** requests / month. Flat-rate Free plans are a different product (smaller allowance, some WAF/DNS bundled). |\n| S3 | Not magically free forever. Stay inside Always Free / credits / plan storage credits. Use **Origin Access Control**, not a public website bucket. |\n| Cognito | **10,000 MAU** on Lite/Essentials. **50,000 MAU is grandfathered** for older user pools (pre-22 Nov 2024). Plus tier has no free MAUs. SMS/email still bill via SNS/SES. |\n| API Gateway | **Not Always Free.** Legacy 12-month 1M calls for older accounts. Newer accounts get **credits**, then pay. HTTP APIs are ~$1/million; REST ~$3.50/million. |\n| Lambda | **Always Free:** 1M requests + 400,000 GB-seconds / month. |\n| DynamoDB | **Always Free on provisioned Standard:** 25 GB + **25 RCU + 25 WCU**. The “~200M requests” line is marketing math from that capacity. **On-demand has no request free tier.** |\n| SQS | **Always Free:** 1M requests / month. |\n| EventBridge | **Management** events are free. **Custom** events are not “1M free.” Scheduler is a different product with its own free invocations. |\n\nHidden bills: Route 53 hosted zone, CloudWatch logs, WAF, a NAT if Lambda needs a VPC, and transfer once you leave Always Free.\n\nThis shape **scales to zero**. It is not a high-concurrency marketplace. Lambda + DynamoDB will still fall over on hot partitions, burst concurrency, and API/Cognito quotas. Say that in the write-up.\n\n## Recap\n\n- **NAT Gateway** is the first line to delete on a small AWS app. The ALB is not automatically next.\n- A public EC2 origin needs CloudFront lock-down. Prefix list **weight 55**, one origin port, origin header, **no naive Fail2ban**. VPC origins if you can.\n- **ECS Express Mode** is the right managed-container default for a small HTTPS API. Budget **ALB + Fargate per task**, not “$30 for five services.”\n- Serverless is the right **portfolio** default. Treat **$0** as quotas plus an alarm, not as Shopee-scale.\n\nGCP sibling of the same “cut noise and fixed cost before the origin” idea: [Cloud Run cost defense: Armor, CDN, and locked ingress](/ops/cloud-run-cost-defense-armor-cdn).\n"])</script><script>self.__next_f.push([1,"11:T1d1b,"])</script><script>self.__next_f.push([1,"\n## Why the bill jumps\n\nCloud Run billing spiked. Logs Explorer showed the usual scanner noise:\n\n- `GET /wp-login.php`\n- `GET /wp-admin/setup-config.php`\n- `GET /.env`\n\nThe app is **Next.js**, not WordPress. No PHP on the stack. Every probe still returns **404**, and you still pay for it.\n\nCloud Run bills **requests** and **instance time** (CPU/memory while instances handle concurrency). A scanner does not need a real page. Enough parallel junk can:\n\n- **Raise concurrency** and keep instances busy on cheap 404s.\n- **Trigger autoscaling** and cold starts when bursts outrun idle capacity.\n\nNext.js middleware can block some of this, but it still burns **container CPU**. Cheaper to cut noise at the **load balancer**: deny obvious paths before Cloud Run sees them, and let the **CDN cache 404s** so repeat probes skip the origin.\n\n## Architecture: three layers\n\n![Cloud Armor, CDN, and Cloud Run defense layers](/images/systems/cloud-run-edge-defense.svg)\n\nRequests hit the external HTTPS load balancer first. Cloud Armor evaluates policy there, so blocked requests are denied before they reach Cloud Run. Allowed requests then pass through Cloud CDN. Cache hits are served from the edge, and cache misses go through the serverless NEG to the Cloud Run revision.\n\n| Layer | Role | What you gain |\n| :--- | :--- | :--- |\n| **Cloud Armor** | WAF-style rules on the **backend service** attached to the load balancer | Obvious scanner paths return **403** at the LB edge; traffic **does not reach** the serverless NEG or Cloud Run. |\n| **Cloud CDN** | Edge caching, including **negative caching** for error responses | After a path legitimately returns **404** once, repeat requests can be served from the edge (very low origin cost). |\n| **Ingress control** | Cloud Run accepts only **internal + load-balanced** traffic | The default **`*.run.app`** URL is no longer a public bypass around Armor and CDN. Users hit **your domain on the LB** only. |\n\n## Layer 1: Cloud Armor as the first filter\n\nBots rotate IPs, so a static IP block list does not scale. **Custom rules** in a Cloud Armor **security policy** use **CEL** (Common Expression Language) on request attributes; regex uses **RE2** via `matches()`.\n\n**Examples (tune priorities to your policy):**\n\n- **PHP probes:** deny paths ending in `.php` (adjust if you ever serve real `.php` assets; most Next.js stacks do not).\n\n```text\nrequest.path.matches('(?i:.*\\\\.php$)')\n```\n\n- **WordPress-shaped paths** (normalize case if your clients send odd casing. `contains` is literal; `request.path.lower()` is an option per the [rules language reference](https://docs.cloud.google.com/armor/docs/rules-language-reference)):\n\n```text\nrequest.path.contains('/wp-admin/') || request.path.contains('/wp-content/')\n```\n\n- **Sensitive file extensions** (extend as needed):\n\n```text\nrequest.path.matches('(?i:.*\\\\.(env|git|bak|sql|config)(/|$))')\n```\n\n**Rules that matter:**\n\n- Put **specific rules above broad ones** in priority order.\n- **Managed rules** (OWASP CRS, Google-managed rules, Adaptive Protection) catch attack classes regex misses and are worth adding on top of path blocks.\n- **False positives:** test in preview mode if you can, then `deny(403)` (or `deny(404)` if you do not want to advertise a block).\n\nDeny actions evaluated at the **load balancer** mean those requests **never invoke** Cloud Run: no container CPU for that request line item.\n\n## Layer 2: CDN negative caching, not \"cache everything\"\n\nDo not turn on **force-cache-all** (`CACHE_MODE_FORCE_CACHE_ALL` or the console equivalent) for a **dynamic** Next.js app. It can cache **200** responses that should stay private or vary per user.\n\nFor scanner traffic, use **negative caching**:\n\n- Configure the backend service / CDN settings so **404** (and optionally **403** if your origin returns them for unknown routes) can be cached at the edge for a bounded TTL (for example **many hours** for static junk paths).\n- **Trade-off:** a long **404** TTL also freezes real mistakes. Ship a bad route, and the edge may keep serving 404 until expiry. Balance scan noise vs recovery time, or purge cache when possible.\n\nUse normal cache rules for static assets (`public/`, hashed filenames). Do not force one cache mode over the whole app.\n\n## Layer 3: Close the `*.run.app` bypass\n\nIf the load balancer is public but the **Cloud Run service URL** is still open to the internet, scanners will hit **`https://\u003cservice\u003e-\u003chash\u003e-\u003cregion\u003e.a.run.app`** directly and **skip Cloud Armor and CDN**.\n\n**Fix (console wording):** set Cloud Run **Ingress** to **Allow internal traffic and traffic from Cloud Load Balancing**. At the API level, ingress is limited to internal sources and Google Cloud external HTTP(S) load balancers. See current [Cloud Run ingress documentation](https://cloud.google.com/run/docs/securing/ingress) for exact labels in your project.\n\nPair that with **DNS and TLS on the external HTTPS load balancer** as the only customer-facing entry.\n\n## Setup steps\n\n1. **Serverless NEG**: point a serverless Network Endpoint Group at the **Cloud Run** service (region, service name).\n2. **Backend service**: use that NEG as the backend; enable **Cloud CDN** when it fits your caching plan.\n3. **URL map + HTTPS proxy + forwarding rule**: create a global external **Application Load Balancer (HTTP/S)** in front of the backend.\n4. **Cloud Armor**: create a security policy, attach it to the **backend service**, and add CEL rules (start strict on obvious scanner paths).\n5. **CDN tuning**: enable **negative caching** for **404** (optional **403**); avoid blanket **force-cache-all** for dynamic apps.\n6. **Cloud Run ingress**: restrict to **internal + Cloud Load Balancing**; verify the default `run.app` URL no longer accepts public probes.\n7. **Validate**: run `curl` against the LB hostname and direct `run.app`; confirm denied paths never appear in **Cloud Run request logs**.\n\n## What to look for in logs\n\nLog field names change between schema versions; search by intent:\n\n- **Load Balancer / Armor:** filter for **deny** outcomes, matched rule names, and **low backend request volume** for garbage paths.\n- **CDN:** filter for **cache fill / hit** indicators vs **origin round-trips**; repeat scans of the same dead path should show **edge satisfaction** rather than new Cloud Run instances spinning up.\n- **Cloud Run:** request logs trend toward **legitimate routes** (for example **200** on real pages) rather than dense **404** storms during idle periods.\n\nBefore hardening, **\"Starting new instance\"** often lined up with scan bursts. Afterward that noise drops on blocked paths. The origin either never sees them, or sees them once per cache key before negative caching kicks in.\n\n## LB cost\n\nA global HTTPS load balancer is not free. Forwarding rules, proxy infrastructure, and data processing costs vary by region.\n\nIt is still cheaper than letting scanner concurrency drive **Cloud Run** instance time without a cap.\n\nMiddleware can express policy; it spends **container** resources. **Cloud Armor** on the backend service, **CDN negative caching** where safe, and **ingress locked to load balancing only** cut junk before your revision runs.\n\nFor Terraform, codify the NEG, backend service, URL map, Armor attachment, and CDN flags next to the Cloud Run service, using the same split as in [Cloud delivery with Cloud Run, Terraform, and Artifact Registry](/ops/cloud-run-terraform-artifact-registry-delivery-flow).\n"])</script><script>self.__next_f.push([1,"12:T270d,"])</script><script>self.__next_f.push([1,"\n## Why this stack works\n\nWhen we build a web app, coding is only half of the story.  \nThe other half is delivery: build, store, deploy, and update safely.\n\nThis stack solves that flow clearly:\n\n- **Cloud Build** builds the container image.\n- **Artifact Registry** stores the image version.\n- **Terraform** defines infra as code.\n- **Cloud Run** runs the app with autoscaling.\n\nOne pipeline, clear ownership, less manual deploy work.\n\n## Tool roles (simple view)\n\n| Tool | Main role | Why it matters |\n| :--- | :--- | :--- |\n| Cloud Build | Build and push image | Reproducible builds from source |\n| Artifact Registry | Store versioned image | Traceable deploys and rollback |\n| Terraform | Provision infra | Same setup across dev/stage/prod |\n| Cloud Run | Run container app | Serverless scale and pay-per-use |\n\n## Terraform use-cases: when and why\n\nTerraform is most useful when infrastructure starts to repeat across environments or people.\n\nUse Terraform when:\n\n- You have **dev/stage/prod** and want the same infra shape in all of them.\n- Your team wants infra changes reviewed in PRs, same as app code.\n- You need repeatable setup for Cloud Run, IAM, Artifact Registry, networking, and secrets.\n- You want safer rollback and auditing (what changed, when, and by whom).\n\nFor a single demo app, console clicks may be fine.  \nFor real delivery flow with more than one environment, Terraform quickly pays back.\n\n## End-to-end flow\n\n![Cloud delivery flow from Git to Cloud Run](/images/systems/cloud-delivery-flow.svg)\n\nThis delivery flow has two connected tracks:\n\n- Build track: Git push triggers Cloud Build, which builds the Docker image and pushes it to Artifact Registry.\n- Deploy track: Terraform applies infrastructure and updates Cloud Run to the target image tag.\n- Rollback track: set the image tag to a previous stable version and run Terraform apply again.\n\nThe key split:\n\n- App artifact lifecycle is handled by build + registry.\n- Runtime infrastructure lifecycle is handled by Terraform.\n\n## Scenario: Deploy a Next.js app\n\nBelow is a **real-shaped** example: Next.js builds inside Docker, the image runs on Cloud Run, and Cloud Build pushes to Artifact Registry.\n\n### A) Pick how Next.js runs in the container\n\n**Option 1: Static export (`output: 'export'`)**  \nGood for marketing sites, docs, and blogs that ship as HTML under `out/`.  \nRun it behind **nginx** in the container. Cloud Run expects the process to listen on **`PORT`** (often `8080`), so nginx should listen on that port.\n\n**Option 2: Node server (`output: 'standalone'`)**  \nUse when you need SSR, Route Handlers, or dynamic rendering.  \nBuild produces `.next/standalone`; you run `node server.js` and set `PORT` to what Cloud Run gives you.\n\nPick one path per project. Mixing export and standalone in one Dockerfile only confuses the build.\n\n### B) Dockerfile: static export + nginx (concrete)\n\n`Dockerfile` (multi-stage: build Next, serve `out/`):\n\n```dockerfile\n# --- build ---\nFROM node:22-alpine AS builder\nWORKDIR /app\nCOPY package.json package-lock.json* ./\nRUN npm ci\nCOPY . .\n# Your app should run `next build` and emit `out/` (next.config: output: \"export\")\nRUN npm run build\n\n# --- run ---\nFROM nginx:1.27-alpine\nCOPY nginx.conf /etc/nginx/conf.d/default.conf\nCOPY --from=builder /app/out /usr/share/nginx/html\nEXPOSE 8080\n```\n\n`nginx.conf` (listen on 8080 so Cloud Run’s default port matches):\n\n```nginx\nserver {\n  listen 8080;\n  server_name _;\n  root /usr/share/nginx/html;\n  index index.html;\n\n  location / {\n    try_files $uri $uri/ $uri.html /index.html;\n  }\n}\n```\n\n`.dockerignore` (keeps the build context small):\n\n```gitignore\nnode_modules\n.next\nout\n.git\n.env*\n```\n\n**Local smoke test:**\n\n```bash\ndocker build -t website:local .\ndocker run --rm -p 8080:8080 website:local\n# Open http://localhost:8080\n```\n\n### C) Dockerfile: Next.js standalone (when you are not using `export`)\n\nIn `next.config` use `output: \"standalone\"`, then:\n\n```dockerfile\nFROM node:22-alpine AS builder\nWORKDIR /app\nCOPY package.json package-lock.json* ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:22-alpine AS runner\nWORKDIR /app\nENV NODE_ENV=production\nENV PORT=8080\nENV HOSTNAME=0.0.0.0\nCOPY --from=builder /app/public ./public\nCOPY --from=builder /app/.next/standalone ./\nCOPY --from=builder /app/.next/static ./.next/static\nCMD [\"node\", \"server.js\"]\n```\n\nCloud Run sets `PORT`; the standalone server reads it, so you usually do not hardcode another port.\n\n### D) `cloudbuild.yaml`: build image and push to Artifact Registry\n\nSubstitutions match the `gcloud builds submit` example later. Adjust project IDs and names.\n\n```yaml\nsubstitutions:\n  _REGION: asia-southeast1\n  _REPO: web-repo\n  _IMAGE_NAME: website\n  _TAG: v1\n\nsteps:\n  - name: gcr.io/cloud-builders/docker\n    args:\n      - build\n      - \"-t\"\n      - \"${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:${_TAG}\"\n      - .\n\nimages:\n  - \"${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE_NAME}:${_TAG}\"\n```\n\nCloud Build’s service account needs permission to push to Artifact Registry (e.g. Artifact Registry Writer on the repo or project).\n\n### E) Build and push image with Cloud Build\n\nExample command:\n\n```bash\ngcloud builds submit --config=cloudbuild.yaml \\\n  --substitutions=_REGION=asia-southeast1,_REPO=web-repo,_IMAGE_NAME=website,_TAG=v1 \\\n  --project=my-web-project\n```\n\nWhat this gives you:\n\n- A tagged image like `asia-southeast1-docker.pkg.dev/my-web-project/web-repo/website:v1`\n- A deployment artifact you can reuse across environments\n\n### F) Keep image in Artifact Registry\n\nWhy this is important:\n\n- Every release has a clear version.\n- Rollback is easy: deploy an older tag.\n- Security scanning and access control are centralized.\n\n### G) Manage Cloud Run with Terraform\n\nSmall Terraform sample:\n\n```hcl\nresource \"google_cloud_run_v2_service\" \"website\" {\n  name     = \"website\"\n  location = var.region\n\n  template {\n    containers {\n      image = var.image_uri\n      ports {\n        container_port = 8080\n      }\n    }\n  }\n}\n```\n\n### H) How to write Terraform (practical workflow)\n\nThink in this order: **providers -\u003e variables -\u003e resources -\u003e outputs**.\n\n1. **Provider and project context**\n\n```hcl\nterraform {\n  required_providers {\n    google = {\n      source  = \"hashicorp/google\"\n      version = \"~\u003e 5.0\"\n    }\n  }\n}\n\nprovider \"google\" {\n  project = var.project_id\n  region  = var.region\n}\n```\n\n2. **Input variables** (things that change by environment)\n\n```hcl\nvariable \"project_id\" { type = string }\nvariable \"region\"     { type = string }\nvariable \"service_name\" {\n  type    = string\n  default = \"website\"\n}\nvariable \"image_uri\" { type = string }\n```\n\n3. **Resources** (what you want Terraform to manage)\n\n```hcl\nresource \"google_artifact_registry_repository\" \"web_repo\" {\n  location      = var.region\n  repository_id = \"web-repo\"\n  format        = \"DOCKER\"\n}\n\nresource \"google_cloud_run_v2_service\" \"website\" {\n  name     = var.service_name\n  location = var.region\n\n  template {\n    containers {\n      image = var.image_uri\n      ports {\n        container_port = 8080\n      }\n    }\n  }\n}\n```\n\n4. **Outputs** (what other steps need)\n\n```hcl\noutput \"cloud_run_uri\" {\n  value = google_cloud_run_v2_service.website.uri\n}\n```\n\n5. **Environment files**\n\nUse a `terraform.tfvars` (or `dev.tfvars`, `prod.tfvars`) per environment:\n\n```hcl\nproject_id   = \"my-web-project-dev\"\nregion       = \"asia-southeast1\"\nservice_name = \"website\"\nimage_uri    = \"asia-southeast1-docker.pkg.dev/my-web-project-dev/web-repo/website:v1\"\n```\n\n6. **Execution cycle**\n\n```bash\nterraform fmt\nterraform init\nterraform validate\nterraform plan -var-file=dev.tfvars\nterraform apply -var-file=dev.tfvars\n```\n\nThat is the full writing loop: write small blocks, validate early, plan before apply, then promote the same code to the next environment by changing only `tfvars`.\n\n### I) Recommended Terraform folder structure\n\nKeep Terraform files boring and predictable:\n\n```plaintext\nterraform/\n  providers.tf\n  variables.tf\n  main.tf\n  outputs.tf\n  dev.tfvars\n  prod.tfvars\n```\n\nMinimal example:\n\n- `providers.tf`: provider and Terraform version.\n- `variables.tf`: typed inputs (`project_id`, `region`, `image_uri`).\n- `main.tf`: Cloud Run + Artifact Registry + IAM resources.\n- `outputs.tf`: service URL, useful IDs.\n- `*.tfvars`: environment-specific values only.\n\nThis layout makes onboarding easier and reduces \"where is that config?\" confusion.\n\nRun:\n\n```bash\nterraform init\nterraform plan\nterraform apply\n```\n\nSet `container_port` to the port the container actually listens on (here **8080**, same as nginx and the standalone example with `PORT=8080`).\n\nNow infra and deploy config are reviewable in Git, same as application code.\n\n## Design choices that save time later\n\n### Pin every deployment by image tag\n\nDo not deploy floating tags like `latest` in production.\nUse explicit tags (`v1`, `v2`, or commit SHA) so release history is deterministic.\n\n### Keep environments separate\n\nUse separate Terraform state or projects for dev/stage/prod.\nThis avoids accidental cross-environment impact.\n\n### Make rollback a first-class path\n\nBecause Cloud Run deploys from image tags, rollback should be one fast command or one Terraform variable change.\n\n## When this is overkill\n\nThis setup is strong, but not always needed.\n\n- For tiny prototypes, full Terraform can feel heavy.\n- Teams new to IaC need onboarding time.\n- Strict release controls add process overhead.\n\nIf your app is still very early, start small and introduce Terraform once services or environments grow.\n\n## Practical checklist\n\n- [ ] Build image in CI, not on local machine\n- [ ] Push only versioned tags to Artifact Registry\n- [ ] Deploy Cloud Run via Terraform, not console clicks\n- [ ] Keep runtime variables in secure config/secrets\n- [ ] Verify rollback path before production release\n\nCloud Run, Terraform, Artifact Registry, and Cloud Build work best as one delivery system. Wired together, deploys stay predictable and reviewable when something breaks at 2am.\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$7\",null,{\"fallback\":null,\"children\":[\"$\",\"$Le\",null,{\"posts\":[{\"slug\":\"aws-cli-named-profiles-multi-iam\",\"title\":\"AWS CLI named profiles: switching IAM users without shooting the wrong account\",\"date\":\"2026-09-16T00:00:00.000Z\",\"excerpt\":\"One IAM user, one key pair, one named profile. How AWS_PROFILE works, why leftover env keys win, and the sts habit that stops wrong-account ECR pushes.\",\"tags\":[\"AWS\",\"AWS CLI\",\"IAM\",\"Profiles\",\"Credentials\",\"ECR\",\"DevOps\"],\"featured\":true,\"content\":\"$f\"},{\"slug\":\"aws-cost-floors-alb-nat-express-mode-free-tier\",\"title\":\"AWS cost floors: ALB, NAT, Express Mode, and free-tier traps\",\"date\":\"2026-09-04T00:00:00.000Z\",\"excerpt\":\"The bill is ALB + NAT, not the t3.small. What actually changes if you strip them, where ECS Express Mode lands, and why a $0 marketplace demo is a usage envelope.\",\"tags\":[\"AWS\",\"ALB\",\"NAT Gateway\",\"ECS\",\"Fargate\",\"CloudFront\",\"Cost optimization\",\"Free Tier\"],\"featured\":true,\"content\":\"$10\"},{\"slug\":\"cloud-run-cost-defense-armor-cdn\",\"title\":\"Cloud Run cost defense: Armor, CDN, and locked ingress\",\"date\":\"2026-05-13T00:00:00.000Z\",\"excerpt\":\"How we cut scanner noise before it burns Cloud Run budget: Cloud Armor at the LB,
